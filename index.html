<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wyszukiwarka głosicieli</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8eaf0;background:#0d1017;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:28px 20px}.muted{color:#9aa3b4}.top,.filters,.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.top{justify-content:space-between}.filters,.card{background:#161b26;border:1px solid #293043;border-radius:14px;padding:15px;margin:20px 0}label{display:grid;gap:5px;font-size:12px;color:#aeb6c7}input,select,button{background:#0e121b;color:#eef;border:1px solid #394259;border-radius:8px;padding:10px 12px}button{cursor:pointer;background:#30384d;font-weight:700}.primary,.active{background:#6d45e5;outline:2px solid #bca8ff}.quiz{background:#246b4c}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #262d3e}th{color:#9ea8ba;font-size:12px}.user{color:#bca8ff;cursor:pointer;font-weight:750}.score{color:#ffb06b;font-size:18px;font-weight:800}.pill{font-size:11px;padding:4px 7px;border-radius:99px;background:#492d24;color:#ffc3a0}.rude{background:#51421d;color:#ffe28a}.other{background:#26364c;color:#b9d8ff}.warn{background:#3d3420;color:#ffd87a}.drawer{position:fixed;inset:5vh 6vw;z-index:20;overflow:auto;max-height:90vh;box-shadow:0 20px 80px #000}.drawer-head{position:sticky;top:-15px;background:#161b26;display:flex;justify-content:space-between;z-index:2}.case{padding:13px 0;border-bottom:1px solid #293043}.message{font-size:16px;margin:8px 0}.empty{text-align:center;padding:45px;color:#8f98aa}.pager{display:flex;gap:10px;align-items:center;margin-top:14px}.search-tools{display:flex;gap:8px;align-items:end;margin-bottom:14px}.search-tools label{min-width:290px}.quiz-card{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));height:auto;max-height:calc(100vh - 32px);margin:0;padding:20px}.quiz-card .drawer-head{position:static;align-items:center}.quiz-card .message{padding:14px;background:#0f1420;border-radius:10px;line-height:1.5}.guess-result{margin-top:14px;padding:12px;border-radius:10px;background:#22293a}.answer-correct{background:#247347!important;outline:2px solid #62d394}.answer-wrong{background:#893745!important;outline:2px solid #f07b8e}button:disabled{cursor:default;opacity:.75}.error{color:#ff9d9d}@media(max-width:800px){.top{align-items:stretch;flex-direction:column}.card{overflow:auto}.quiz-card{width:calc(100vw - 20px)}}
.nick-suggestions{position:fixed;z-index:1000;max-height:320px;overflow-y:auto;padding:5px;background:#111722;border:1px solid #596987;border-radius:9px;box-shadow:0 12px 32px #000b}.nick-suggestion{display:block;width:100%;padding:10px 12px;border:0;background:transparent;text-align:left;color:#eef;border-radius:6px}.nick-suggestion:hover,.nick-suggestion.selected{background:#6d45e5}.nick-suggestions[hidden]{display:none}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><div><h1>Wyszukiwarka głosicieli</h1><div id="status" class="muted">Wczytywanie danych…</div></div><button id="quizBtn" class="quiz">Zgadnij ocenę silnika</button></div>
<section class="filters"><label>Data od<input id="start" type="date"></label><label>Data do<input id="end" type="date"></label><button id="refresh" class="primary">Odśwież okres</button><label>Sortowanie<select id="sort"><option value="balanced">Zbalansowany wynik</option><option value="small">1–2 ciężkie incydenty</option><option value="burst">Intensywność w krótkim czasie</option><option value="incidents">Liczba incydentów</option><option value="mentions">Liczba nawiązań</option></select></label><button id="direction">Malejąco ↓</button></section>
<section class="card"><div class="search-tools"><label>Wyszukaj użytkownika<input id="userSearch" type="search" placeholder="Wpisz nick lub jego fragment…" autocomplete="off"></label><button id="clearSearch">Wyczyść</button></div><table><thead><tr><th>#</th><th>Użytkownik</th><th>Wynik</th><th>Incydenty</th><th>Nawiązania</th><th>Dni</th><th>Moderacja</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev">← Poprzednia</button><span id="page" class="muted"></span><button id="next">Następna →</button></div></section>
<section id="drawer" class="card drawer" hidden><div class="drawer-head"><h2 id="who"></h2><button id="close">✕ Zamknij</button></div><div class="actions"><button id="violationsMode" class="active">Oceny silnika</button><button id="mentionsMode">Wzmianki monitorowane</button><button id="allMode">Wszystkie wiadomości</button></div><div id="historyFilters" class="filters" hidden><label>Historia od<input id="historyStart" type="date"></label><label>Historia do<input id="historyEnd" type="date"></label><button id="refreshHistory">Odśwież historię</button><button id="historyDirection">Najnowsze najpierw ↓</button></div><div id="historyStatus" class="muted"></div><div id="cases"></div><div class="pager"><button id="more">Wczytaj następne 50</button></div></section>
<section id="quiz" class="card drawer quiz-card" hidden><div class="drawer-head"><h2>Zgadnij ocenę silnika</h2><button id="closeQuiz">✕ Zamknij</button></div><p class="muted">Etykieta silnika jest ukryta. Wybierz swoją odpowiedź, aby ją odsłonić.</p><div id="quizMessage" class="message"></div><div class="actions"><button data-guess="toxic">Toksyczne</button><button data-guess="rude">Niemiłe / chamskie</button><button data-guess="other">False positive</button></div><div id="quizResult" class="guess-result" hidden></div><button id="nextQuiz" class="primary" hidden>Następna losowa wiadomość</button></section>
<div id="error" class="error"></div>
</main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',dateStyle:'short',timeStyle:'medium'}),names={toxic:'Toksyczne',rude:'Niemiłe / chamskie',other:'False positive'};
let DATA,offset=0,total=0,direction='desc',detailUser='',detailName='',detailMode='violations',detailOffset=0,currentQuiz=null,quizLocked=false,allUserMessages=[],historyOrder='desc';const limit=100,monthArchiveCache=new Map,userHistoryCache=new Map,archiveCacheLimit=6;
fetch('data.json?v=20260818-nick-search',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{DATA=x;$('#start').value=x.meta.first_day;$('#end').value=x.meta.last_day;const historyFrom=new Date(x.meta.last_day+'T12:00:00Z');historyFrom.setUTCDate(historyFrom.getUTCDate()-30);$('#historyStart').value=historyFrom.toISOString().slice(0,10)<x.meta.first_day?x.meta.first_day:historyFrom.toISOString().slice(0,10);$('#historyEnd').value=x.meta.last_day;$('#status').textContent=`Pełna baza: ${x.meta.message_count.toLocaleString('pl-PL')} wiadomości · ${(x.users||[]).length.toLocaleString('pl-PL')} użytkowników · ${x.meta.engine_cases.toLocaleString('pl-PL')} ocen silnika · model ${x.meta.model_version}`;renderRanking()}).catch(e=>$('#error').textContent='Nie udało się wczytać data.json: '+e.message);
function range(){return [$('#start').value,$('#end').value]}
function aggregate(){const [a,b]=range(),map=new Map,query=$('#userSearch').value.trim().toLocaleLowerCase('pl-PL');for(const x of DATA.daily){if(x.day<a||x.day>b||!x.incidents)continue;let u=map.get(x.user_key)||{user_key:x.user_key,display_name:x.display_name,incidents:0,mentions:0,evidence:0,days:0,max_severity:0};u.incidents+=x.incidents;u.mentions+=x.mentions;u.evidence+=x.evidence;u.days++;u.max_severity=Math.max(u.max_severity,x.max_severity||0);map.set(x.user_key,u)}if(query){for(const name of (DATA.users||[])){const key=name.toLocaleLowerCase('pl-PL');if(key.includes(query)&&!map.has(key))map.set(key,{user_key:key,display_name:name,incidents:0,mentions:0,evidence:0,days:0,max_severity:0})}for(const [key,u] of map)if(!u.display_name.toLocaleLowerCase('pl-PL').includes(query))map.delete(key)}const mods=new Map;for(const m of DATA.moderation){if(m.day<a||m.day>b)continue;let v=mods.get(m.user_key)||{banned:0,timeouts:0};v.banned=Math.max(v.banned,m.banned);v.timeouts+=m.timeouts;mods.set(m.user_key,v)}let out=[...map.values()];for(const u of out){const rate=u.evidence/(u.incidents*3+50),recurrence=Math.min(1.35,1+Math.max(0,u.days-1)*.05),reliability=Math.min(1,u.incidents/3);u.score=Math.min(100,Math.round(rate*recurrence*reliability*1000)/10);u.burst=Math.round(u.evidence/Math.max(1,u.days)*100)/100;Object.assign(u,mods.get(u.user_key)||{banned:0,timeouts:0})}const sort=$('#sort').value,keys={balanced:u=>[u.score,u.evidence],small:u=>[u.incidents===1||u.incidents===2,u.max_severity,u.evidence],burst:u=>[u.burst,u.max_severity],incidents:u=>[u.incidents,u.max_severity],mentions:u=>[u.mentions,u.incidents]}[sort];out.sort((a,b)=>{const A=keys(a),B=keys(b);for(let i=0;i<A.length;i++)if(A[i]!==B[i])return (A[i]>B[i]?1:-1)*(direction==='desc'?-1:1);return a.display_name.localeCompare(b.display_name,'pl')});return out}
function renderRanking(reset=false){if(!DATA)return;if(reset)offset=0;const all=aggregate();total=all.length,items=all.slice(offset,offset+limit);$('#rows').innerHTML=items.map((x,i)=>`<tr><td>${offset+i+1}</td><td class="user" data-user="${esc(x.user_key)}">${esc(x.display_name)}</td><td class="score">${$('#sort').value==='burst'?x.burst:x.score}</td><td>${x.incidents}</td><td>${x.mentions}</td><td>${x.days}</td><td>${x.banned?'<span class="pill">ZBANOWANY</span>':x.timeouts?`<span class="pill warn">timeout ×${x.timeouts}</span>`:'<span class="muted">brak</span>'}</td></tr>`).join('');const pages=Math.max(1,Math.ceil(total/limit));$('#page').textContent=`Strona ${Math.floor(offset/limit)+1} z ${pages} · ${total} użytkowników`;$('#prev').disabled=!offset;$('#next').disabled=offset+limit>=total;document.querySelectorAll('#rows .user').forEach(e=>e.onclick=()=>openUser(e.dataset.user,e.textContent))}
function selectedCases(){const [a,b]=range();return DATA.violations.filter(x=>x.user_key===detailUser&&x.day>=a&&x.day<=b&&(detailMode==='mentions'?x.has_mention:x.label!=='other')).sort((a,b)=>b.ts.localeCompare(a.ts))}
function caseHtml(x){const certainty=Math.round(Math.max(x.toxic_probability,x.rude_probability,x.other_probability)*100);return `<article class="case"><div><span class="pill ${x.label}">${names[x.label]}</span> <span class="pill">${esc(x.category)}</span> <span class="muted">${esc(dateFmt.format(new Date(x.ts)))} · pewność ${certainty}%</span></div><div class="message">${esc(x.text)}</div><div class="muted">${esc(x.rationale)}</div></article>`}
function openUser(key,name){detailUser=key;detailName=name;detailMode='violations';detailOffset=0;allUserMessages=[];$('#historyStart').value=$('#start').value;$('#historyEnd').value=$('#end').value;$('#who').textContent=name;$('#drawer').hidden=false;$('#historyFilters').hidden=true;$('#historyStatus').textContent='';loadCases(false)}
function loadCases(append){const all=selectedCases(),items=all.slice(detailOffset,detailOffset+50),html=items.map(caseHtml).join('');if(append)$('#cases').insertAdjacentHTML('beforeend',html);else $('#cases').innerHTML=html||'<div class="empty">Brak przypadków w tym okresie.</div>';detailOffset+=items.length;$('#more').hidden=detailOffset>=all.length;$('#violationsMode').classList.toggle('active',detailMode==='violations');$('#mentionsMode').classList.toggle('active',detailMode==='mentions')}
async function readGzipJson(file){if(monthArchiveCache.has(file)){const cached=monthArchiveCache.get(file);monthArchiveCache.delete(file);monthArchiveCache.set(file,cached);return cached}const job=(async()=>{const response=await fetch(file,{cache:'force-cache'});if(!response.ok)throw Error(`${file}: ${response.status}`);if(typeof DecompressionStream==='undefined')throw Error('Ta przeglądarka nie obsługuje odczytu skompresowanego archiwum. Użyj aktualnego Chrome, Edge lub Firefox.');const stream=response.body.pipeThrough(new DecompressionStream('gzip'));return new Response(stream).json()})();monthArchiveCache.set(file,job);while(monthArchiveCache.size>archiveCacheLimit)monthArchiveCache.delete(monthArchiveCache.keys().next().value);try{return await job}catch(e){monthArchiveCache.delete(file);throw e}}
async function loadAllMessages(){const a=$('#historyStart').value,b=$('#historyEnd').value,cacheKey=`${detailUser}|${a}|${b}`,cached=userHistoryCache.get(cacheKey);if(cached){allUserMessages=[...cached];allUserMessages.sort((x,y)=>historyOrder==='desc'?y[0].localeCompare(x[0]):x[0].localeCompare(y[0]));detailOffset=0;$('#historyStatus').textContent=`${allUserMessages.length.toLocaleString('pl-PL')} wiadomości · wczytano z pamięci`;renderAllMessages(false);return}const wanted=DATA.months.filter(x=>x.month>=a.slice(0,7)&&x.month<=b.slice(0,7));allUserMessages=[];$('#cases').innerHTML='<div class="empty">Wczytywanie pełnej historii…</div>';$('#more').hidden=true;for(let i=0;i<wanted.length;i++){const month=wanted[i],inMemory=monthArchiveCache.has(month.file);$('#historyStatus').textContent=`${inMemory?'Odczytywanie z pamięci':'Pobieranie'} ${i+1}/${wanted.length}: ${month.month}`;const rows=await readGzipJson(month.file);for(const row of rows){const day=row[0].slice(0,10);if(day>=a&&day<=b&&row[1].toLocaleLowerCase('pl-PL')===detailUser)allUserMessages.push(row)}}userHistoryCache.set(cacheKey,[...allUserMessages]);while(userHistoryCache.size>30)userHistoryCache.delete(userHistoryCache.keys().next().value);allUserMessages.sort((x,y)=>historyOrder==='desc'?y[0].localeCompare(x[0]):x[0].localeCompare(y[0]));detailOffset=0;$('#historyStatus').textContent=`${allUserMessages.length.toLocaleString('pl-PL')} wiadomości w wybranym okresie`;renderAllMessages(false)}
function renderAllMessages(append){const items=allUserMessages.slice(detailOffset,detailOffset+50);let lastDay=append&&detailOffset?allUserMessages[detailOffset-1][0].slice(0,10):'',html='';for(const x of items){const day=x[0].slice(0,10);if(day!==lastDay){html+=`<h3>${esc(day)}</h3>`;lastDay=day}html+=`<div class="case"><span class="muted">${esc(new Date(x[0]).toLocaleTimeString('pl-PL'))}</span> &nbsp; ${esc(x[2])}</div>`}if(append)$('#cases').insertAdjacentHTML('beforeend',html);else $('#cases').innerHTML=html||'<div class="empty">Brak wiadomości.</div>';detailOffset+=items.length;$('#more').hidden=detailOffset>=allUserMessages.length}
function setMode(mode){detailMode=mode;detailOffset=0;$('#violationsMode').classList.toggle('active',mode==='violations');$('#mentionsMode').classList.toggle('active',mode==='mentions');$('#allMode').classList.toggle('active',mode==='all');$('#historyFilters').hidden=mode!=='all';$('#historyStatus').textContent='';if(mode==='all'){$('#cases').innerHTML='<div class="empty">Wybierz zakres historii i kliknij „Odśwież historię”.</div>';$('#more').hidden=true}else loadCases(false)}
function newQuiz(){const [a,b]=range(),pool=DATA.violations.filter(x=>x.day>=a&&x.day<=b),roll=Math.random(),wanted=roll<.30?'toxic':roll<.60?'rude':'other',bucket=pool.filter(x=>x.label===wanted),choices=bucket.length?bucket:pool;currentQuiz=choices[Math.floor(Math.random()*choices.length)];quizLocked=false;$('#quizMessage').textContent=currentQuiz?.text||'Brak wiadomości w tym okresie.';$('#quizResult').hidden=true;$('#nextQuiz').hidden=true;document.querySelectorAll('[data-guess]').forEach(b=>{b.disabled=!currentQuiz;b.classList.remove('answer-correct','answer-wrong')})}
function guess(label){if(!currentQuiz||quizLocked)return;quizLocked=true;const certainty=Math.round(Math.max(currentQuiz.toxic_probability,currentQuiz.rude_probability,currentQuiz.other_probability)*100),ok=label===currentQuiz.label,correct=document.querySelector(`[data-guess="${currentQuiz.label}"]`),chosen=document.querySelector(`[data-guess="${label}"]`);document.querySelectorAll('[data-guess]').forEach(b=>b.disabled=true);correct.classList.add('answer-correct');if(!ok)chosen.classList.add('answer-wrong');$('#quizResult').innerHTML=`${ok?'✓ Trafione':'✕ Inna odpowiedź'} — silnik: <b>${names[currentQuiz.label]}</b> (${certainty}% pewności)`;$('#quizResult').hidden=false;$('#nextQuiz').hidden=false}
let searchTimer;$('#userSearch').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderRanking(true),250)};$('#userSearch').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(searchTimer);renderRanking(true)}};$('#clearSearch').onclick=()=>{$('#userSearch').value='';renderRanking(true)};$('#refreshHistory').onclick=()=>loadAllMessages().catch(e=>{$('#cases').innerHTML=`<div class="error">${esc(e.message)}</div>`});$('#historyDirection').onclick=()=>{historyOrder=historyOrder==='desc'?'asc':'desc';$('#historyDirection').textContent=historyOrder==='desc'?'Najnowsze najpierw ↓':'Najstarsze najpierw ↑';if(allUserMessages.length){allUserMessages.sort((x,y)=>historyOrder==='desc'?y[0].localeCompare(x[0]):x[0].localeCompare(y[0]));detailOffset=0;renderAllMessages(false)}};$('#refresh').onclick=()=>renderRanking(true);$('#sort').onchange=()=>renderRanking(true);$('#direction').onclick=()=>{direction=direction==='desc'?'asc':'desc';$('#direction').textContent=direction==='desc'?'Malejąco ↓':'Rosnąco ↑';renderRanking(true)};$('#prev').onclick=()=>{offset=Math.max(0,offset-limit);renderRanking()};$('#next').onclick=()=>{if(offset+limit<total){offset+=limit;renderRanking()}};$('#close').onclick=()=>$('#drawer').hidden=true;$('#more').onclick=()=>detailMode==='all'?renderAllMessages(true):loadCases(true);$('#violationsMode').onclick=()=>setMode('violations');$('#mentionsMode').onclick=()=>setMode('mentions');$('#allMode').onclick=()=>setMode('all');$('#quizBtn').onclick=()=>{$('#quiz').hidden=false;newQuiz()};$('#closeQuiz').onclick=()=>$('#quiz').hidden=true;$('#nextQuiz').onclick=newQuiz;document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>guess(b.dataset.guess));
const nickSuggestions=document.createElement('div');nickSuggestions.id='nickSuggestions';nickSuggestions.className='nick-suggestions';nickSuggestions.hidden=true;document.body.appendChild(nickSuggestions);let suggestionIndex=-1;function positionSuggestions(){const r=$('#userSearch').getBoundingClientRect();nickSuggestions.style.left=`${r.left}px`;nickSuggestions.style.top=`${r.bottom+5}px`;nickSuggestions.style.width=`${r.width}px`;nickSuggestions.style.maxHeight=`${Math.max(120,Math.min(320,innerHeight-r.bottom-16))}px`}function hideSuggestions(){$('#nickSuggestions').hidden=true;suggestionIndex=-1}function webSuggestions(query){if(!DATA?.users)return[];const q=query.toLocaleLowerCase('pl-PL'),prefix=[],contains=[];for(const name of DATA.users){const key=name.toLocaleLowerCase('pl-PL');if(key.startsWith(q))prefix.push(name);else if(key.includes(q))contains.push(name)}const sorter=(a,b)=>a.length-b.length||a.localeCompare(b,'pl');return prefix.sort(sorter).concat(contains.sort(sorter)).slice(0,10)}function selectSuggestion(name){$('#userSearch').value=name;hideSuggestions();clearTimeout(searchTimer);renderRanking(true)}function updateSuggestions(){const q=$('#userSearch').value.trim();positionSuggestions();if(q&&!DATA){$('#nickSuggestions').innerHTML='<div class="muted" style="padding:10px">Trwa wczytywanie listy użytkowników…</div>';$('#nickSuggestions').hidden=false;return}const names=q?webSuggestions(q):[];$('#nickSuggestions').innerHTML=names.map(name=>`<button type="button" class="nick-suggestion" data-name="${esc(name)}">${esc(name)}</button>`).join('');$('#nickSuggestions').hidden=!names.length;document.querySelectorAll('.nick-suggestion').forEach(el=>el.onclick=()=>selectSuggestion(el.dataset.name));suggestionIndex=-1}$('#userSearch').oninput=()=>{clearTimeout(searchTimer);updateSuggestions();searchTimer=setTimeout(()=>renderRanking(true),250)};$('#userSearch').onkeydown=e=>{const items=[...document.querySelectorAll('.nick-suggestion')];if((e.key==='ArrowDown'||e.key==='ArrowUp')&&items.length&&!$('#nickSuggestions').hidden){e.preventDefault();suggestionIndex=(suggestionIndex+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('selected',i===suggestionIndex));items[suggestionIndex].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){clearTimeout(searchTimer);if(suggestionIndex>=0&&items[suggestionIndex])selectSuggestion(items[suggestionIndex].dataset.name);else{hideSuggestions();renderRanking(true)}}else if(e.key==='Escape')hideSuggestions()};$('#clearSearch').onclick=()=>{$('#userSearch').value='';hideSuggestions();renderRanking(true)};document.addEventListener('click',e=>{if(!e.target.closest('.search-tools')&&!e.target.closest('.nick-suggestions'))hideSuggestions()});addEventListener('resize',()=>{if(!nickSuggestions.hidden)positionSuggestions()});addEventListener('scroll',()=>{if(!nickSuggestions.hidden)positionSuggestions()},{passive:true});
$('#refreshHistory').onclick=()=>{if(detailMode!=='all')return;loadAllMessages().catch(e=>{$('#cases').innerHTML=`<div class="error">${esc(e.message)}</div>`})};$('#historyDirection').onclick=()=>{if(detailMode!=='all')return;historyOrder=historyOrder==='desc'?'asc':'desc';$('#historyDirection').textContent=historyOrder==='desc'?'Najnowsze najpierw ↓':'Najstarsze najpierw ↑';if(allUserMessages.length){allUserMessages.sort((x,y)=>historyOrder==='desc'?y[0].localeCompare(x[0]):x[0].localeCompare(y[0]));detailOffset=0;renderAllMessages(false)}};
</script></body></html>
